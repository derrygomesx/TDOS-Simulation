name: TDOS Tests

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:

      matrix:

        python-version:

          - "3.11"

          - "3.12"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Package
        run: |
          pip install -e .
`r`n      - name: Install Test Dependencies`r`n        run: |`r`n          python -m pip install pytest
      - name: Run Tests
        run: |
          pytest -v

      - name: Display Success
        if: success()
        run: |
          echo "✅ All TDOS tests passed."

      - name: Display Failure
        if: failure()
        run: |
          echo "❌ TDOS tests failed."
